<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaigofukushishi Quiz Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <div>
        <p class="subtitle"><ruby>介護福祉士<rt>かいごふくしし</rt></ruby><ruby>学習<rt>がくしゅう</rt></ruby>ゲーム</p>
        <h1 id="quiz-title">125<ruby>問<rt>もん</rt></ruby>クイズ</h1>
      </div>
      <div class="score-panel">
        <p id="progress">Question 1 / 125</p>
        <p id="score">Score: 0</p>
        <p id="timer">Time: 00:00</p>
      </div>
    </header>

    <main>
      <section class="card" id="exam-selection">
        <div class="exam-header">
          <h2><ruby>試験<rt>しけん</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>してください</h2>
          <button id="resume-button" class="primary-button hidden"></button>
        </div>
        <div class="choices" id="exam-buttons"></div>
      </section>

      <section class="card hidden" id="quiz-card">
        <p class="question-text" id="question-text">Loading question...</p>
        <div class="choices" id="choices"></div>
        <div id="correct-answer-area" class="hidden">
          <h3>正解:</h3>
          <p id="correct-answer-text"></p>
        </div>
        <div class="quiz-navigation">
          <button id="prev-button" class="primary-button secondary-button" disabled>前の問題</button>
          <button id="next-button" class="primary-button">次の問題</button>
        </div>
      </section>

      <div class="menu-nav hidden" id="menu-nav">
        <button id="back-button" class="primary-button secondary-button">メニューに<ruby>戻<rt>もど</rt></ruby>る</button>
      </div>

      <section class="result hidden" id="result-screen">
        <h2 id="result-status"><ruby>結果<rt>けっか</rt></ruby></h2>
        <p id="final-score"></p>
        <p id="final-time"></p>
        <p id="final-attempts"></p>
        <p id="best-time"></p>
        <p id="avg-time"></p>
        <div class="result-actions">
          <button id="restart-button" class="primary-button">Restart Quiz</button>
          <button id="back-button-result" class="primary-button secondary-button">メニューに<ruby>戻<rt>もど</rt></ruby>る</button>
        </div>
      </section>
    </main>
  </div>

  <script src="questions.js"></script>
  <script src="questions38pm.js"></script>
  <script src="script.js"></script>
</body>
</html>
