<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaigofukushishi Quiz Game</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    #site-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background:
        radial-gradient(900px 520px at 12% -5%, rgba(255, 159, 28, 0.16), transparent 60%),
        radial-gradient(900px 620px at 92% 108%, rgba(46, 196, 182, 0.13), transparent 60%),
        radial-gradient(circle at top, #16203b 0%, #0d1321 68%);
      color: #f7f7ff;
      font-family: "M PLUS Rounded 1c", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 0.55s ease, visibility 0.55s ease;
      animation: loaderAutoHide 0.6s ease 3.4s forwards;
    }
    #site-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-inner {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 16vh 20px 0;
    }
    .loader-kicker {
      margin: 0 0 10px;
      color: #7fd8cd;
      letter-spacing: 0.14em;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .loader-title {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 24px rgba(255, 159, 28, 0.3);
    }
    .loader-sub {
      margin: 12px 0 0;
      color: #a8bcd6;
      font-size: 1rem;
    }
    .loader-dots::after {
      content: "";
      animation: loaderDots 1s steps(4, end) infinite;
    }
    .loader-bar {
      width: min(300px, 70vw);
      height: 6px;
      margin: 26px auto 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }
    .loader-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffb03a, #ff8a00);
      animation: loaderBar 1.1s ease-in-out infinite;
    }
    .loader-road {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 29%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), rgba(255, 159, 28, 0.5), rgba(255, 255, 255, 0.28), transparent);
      box-shadow: 0 0 18px rgba(255, 159, 28, 0.22);
    }
    .loader-road::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 11px;
      height: 2px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.35) 0 34px, transparent 34px 68px);
      opacity: 0.35;
    }
    .loader-car {
      position: absolute;
      left: 0;
      bottom: calc(29% + 10px);
      z-index: 3;
      width: min(360px, 76vw);
      transform: translateX(-115%);
      animation: loaderCarAcross 1.65s cubic-bezier(0.42, 0.02, 0.66, 1) 0.15s forwards;
      filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.35));
    }
    .loader-car svg {
      display: block;
      width: 100%;
      height: auto;
      animation: loaderBob 0.16s ease-in-out infinite alternate;
    }
    .loader-speed {
      position: absolute;
      left: -58px;
      top: 42%;
      width: 58px;
    }
    .loader-speed span {
      display: block;
      height: 3px;
      margin: 7px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(127, 216, 205, 0.9));
      animation: loaderStreak 0.42s linear infinite;
    }
    .loader-speed span:nth-child(1) { width: 46px; }
    .loader-speed span:nth-child(2) { width: 58px; animation-delay: 0.08s; }
    .loader-speed span:nth-child(3) { width: 38px; animation-delay: 0.16s; }
    .loader-wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: loaderWheelSpin 0.45s linear infinite;
    }
    @keyframes loaderDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
    @keyframes loaderBar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }
    @keyframes loaderCarAcross {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(100vw); }
    }
    @keyframes loaderBob {
      from { transform: translateY(0); }
      to { transform: translateY(-2px); }
    }
    @keyframes loaderStreak {
      0% { transform: translateX(10px); opacity: 0; }
      35% { opacity: 0.9; }
      100% { transform: translateX(-18px); opacity: 0; }
    }
    @keyframes loaderWheelSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes loaderAutoHide {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }
    @media (max-width: 560px) {
      .loader-inner { padding-top: 13vh; }
      .loader-road { bottom: 31%; }
      .loader-car { bottom: calc(31% + 10px); }
    }
  </style>
  <noscript><style>#site-loader { display: none; }</style></noscript>
</head>
<body>
  <div id="site-loader" aria-hidden="true">
    <div class="loader-inner">
      <p class="loader-kicker"><ruby>介護福祉士<rt>かいごふくしし</rt></ruby><ruby>学習<rt>がくしゅう</rt></ruby>ゲーム</p>
      <p class="loader-title">125<ruby>問<rt>もん</rt></ruby>クイズ</p>
      <p class="loader-sub"><span class="loader-dots">Loading</span></p>
      <div class="loader-bar"><span></span></div>
    </div>
    <div class="loader-road"></div>
    <div class="loader-car">
      <div class="loader-speed"><span></span><span></span><span></span></div>
      <svg viewBox="0 0 360 132" role="img" aria-label="GT car">
        <defs>
          <linearGradient id="loaderCarPaint" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#c7d0dd" />
            <stop offset="0.58" stop-color="#eef3f8" />
            <stop offset="1" stop-color="#aeb9c8" />
          </linearGradient>
        </defs>
        <path d="M14 30 L96 22 L104 36 L24 44 Z" fill="#0b1220" stroke="rgba(255,255,255,0.18)" />
        <path d="M66 42 L80 82 L94 82 L88 42 Z" fill="#0b1220" />
        <path d="M22 88 C28 70 48 60 78 55 C104 34 142 24 184 28 C222 30 252 40 282 54 C310 60 330 72 336 84 C338 92 334 98 324 99 L292 101 C286 84 268 74 246 74 C224 74 208 84 202 101 L124 101 C118 84 100 74 78 74 C56 74 40 84 34 101 L24 99 C16 97 16 94 22 88 Z" fill="url(#loaderCarPaint)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />
        <path d="M20 92 C24 70 48 59 82 53 L118 44 L122 101 L30 101 C20 100 16 98 20 92 Z" fill="#d7263d" opacity="0.96" />
        <path d="M112 54 C134 34 168 27 202 34 C216 37 228 44 238 54 L224 58 C190 50 150 52 126 60 Z" fill="#0b1220" opacity="0.94" />
        <path d="M118 76 L286 66" stroke="#ff9f1c" stroke-width="6" stroke-linecap="round" opacity="0.9" />
        <path d="M150 52 L146 98" stroke="rgba(13,19,33,0.35)" stroke-width="2" />
        <circle cx="176" cy="72" r="17" fill="#f7f7ff" stroke="#111827" stroke-width="2" />
        <text x="176" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">712</text>
        <path d="M306 70 L330 80 L306 84 Z" fill="#ffe9a8" />
        <rect x="22" y="72" width="16" height="6" rx="3" fill="#ff3355" />
        <circle cx="78" cy="90" r="29" fill="#0d1321" />
        <circle cx="246" cy="90" r="29" fill="#0d1321" />
        <g class="loader-wheel">
          <circle cx="78" cy="90" r="24" fill="#0a0f18" stroke="#2b3648" stroke-width="3" />
          <circle cx="78" cy="90" r="12" fill="#d7dee9" />
          <path d="M78 68 V112 M56 90 H100 M64 76 L92 104 M92 76 L64 104" stroke="#5b6b82" stroke-width="3" stroke-linecap="round" />
          <circle cx="78" cy="90" r="4" fill="#111827" />
        </g>
        <g class="loader-wheel">
          <circle cx="246" cy="90" r="24" fill="#0a0f18" stroke="#2b3648" stroke-width="3" />
          <circle cx="246" cy="90" r="12" fill="#d7dee9" />
          <path d="M246 68 V112 M224 90 H268 M232 76 L260 104 M260 76 L232 104" stroke="#5b6b82" stroke-width="3" stroke-linecap="round" />
          <circle cx="246" cy="90" r="4" fill="#111827" />
        </g>
        <path d="M286 102 L342 102 L336 110 L292 110 Z" fill="#0b1220" />
        <path d="M18 100 L70 100 L64 110 L22 110 Z" fill="#0b1220" />
      </svg>
    </div>
  </div>
  <div class="app-shell">
    <header>
      <div>
        <p class="subtitle"><ruby>介護福祉士<rt>かいごふくしし</rt></ruby><ruby>学習<rt>がくしゅう</rt></ruby>ゲーム</p>
        <h1 id="quiz-title">125<ruby>問<rt>もん</rt></ruby>クイズ</h1>
      </div>
      <div class="score-panel">
        <p id="progress">Question 1 / 125</p>
        <p id="score">Score: 0</p>
        <p id="timer">Time: 00:00</p>
      </div>
    </header>

    <main>
      <section class="card" id="exam-selection">
        <div class="exam-header">
          <h2><ruby>試験<rt>しけん</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>してください</h2>
          <button id="resume-button" class="primary-button hidden"></button>
        </div>
        <div class="mode-tabs">
          <button class="mode-tab active" id="tab-exams" type="button"><ruby>年度別<rt>ねんどべつ</rt></ruby></button>
          <button class="mode-tab" id="tab-drills" type="button"><ruby>科目別<rt>かもくべつ</rt></ruby>ドリル</button>
        </div>
        <div id="panel-exams">
          <div class="choices" id="exam-buttons"></div>
        </div>
        <div id="panel-drills" class="hidden">
          <p class="panel-note">第34・35・36・37・38回（全年度）から、科目ごとに集めた問題です。</p>
          <div class="choices" id="drill-buttons"></div>
        </div>
      </section>

      <section class="card hidden" id="domain-selection">
        <div class="exam-header">
          <h2><ruby>学習分野<rt>がくしゅうぶんや</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>してください</h2>
          <button id="back-from-domain" class="primary-button secondary-button">戻る</button>
        </div>
        <div class="choices" id="domain-buttons"></div>
      </section>

      <section class="card hidden" id="quiz-card">
        <div class="quiz-header-controls">
          <p class="category-tag" id="category-tag"></p>
          <div class="jump-to-question">
            <input type="number" id="jump-input" placeholder="Jump to Q#" min="1" max="125">
            <button id="jump-button" class="primary-button jump-button">Jump</button>
          </div>
        </div>
        <p class="question-text" id="question-text">Loading question...</p>
        <div class="choices" id="choices"></div>
        <div id="feedback-area" class="hidden">
          <div id="correct-answer-area">
            <h3>✓ 正解:</h3>
            <p id="correct-answer-text"></p>
            <p id="correct-explanation" class="explanation-text"></p>
          </div>
          <div id="wrong-answer-area" class="hidden">
            <h3>✗ 選んだ答えが間違っている理由:</h3>
            <p id="wrong-explanation" class="explanation-text"></p>
          </div>
          <details id="other-answers-details" class="hidden">
            <summary>他の選択肢の説明を見る</summary>
            <div id="other-answers-area"></div>
          </details>
        </div>
        <div class="quiz-navigation">
          <button id="prev-button" class="primary-button secondary-button" disabled>前の問題</button>
          <button id="next-button" class="primary-button">次の問題</button>
          <button id="back-to-results-button" class="primary-button secondary-button hidden">結果に<ruby>戻<rt>もど</rt></ruby>る</button>
        </div>
      </section>

      <div class="menu-nav hidden" id="menu-nav">
        <button id="back-button" class="primary-button secondary-button">メニューに<ruby>戻<rt>もど</rt></ruby>る</button>
      </div>

      <section class="result hidden" id="result-screen">
        <h2 id="result-status"><ruby>結果<rt>けっか</rt></ruby></h2>
        <p id="final-score"></p>
        <p id="final-time"></p>
        <p id="final-attempts"></p>
        <p id="best-time"></p>
        <p id="avg-time"></p>
        
        <div id="summary-section" class="summary-section hidden">
          <h3 id="summary-title"><ruby>回答結果一覧<rt>かいとうけっかいちらん</rt></ruby></h3>
          <div id="summary-list" class="summary-list"></div>
        </div>
        
        <div class="result-actions">
          <button id="restart-button" class="primary-button">Restart Quiz</button>
          <button id="back-button-result" class="primary-button secondary-button">メニューに<ruby>戻<rt>もど</rt></ruby>る</button>
        </div>
      </section>
    </main>
  </div>

  <script src="questions.js"></script>
  <script src="questions38pm.js"></script>
  <script src="domains.js"></script>
  <script src="drill.js"></script>
  <script src="sim.js"></script>
<script src="script.js"></script>
  <script>
    (function () {
      var tabs = [
        { btn: document.getElementById("tab-exams"), panel: document.getElementById("panel-exams") },
        { btn: document.getElementById("tab-drills"), panel: document.getElementById("panel-drills") }
      ];
      function activate(active) {
        tabs.forEach(function (t) {
          var on = t === active;
          t.btn.classList.toggle("active", on);
          t.panel.classList.toggle("hidden", !on);
        });
      }
      tabs.forEach(function (t) {
        t.btn.addEventListener("click", function () { activate(t); });
      });
    })();
  </script>
  <script>
    (function () {
      var loader = document.getElementById("site-loader");
      if (!loader) return;
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add("done");
        window.setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 700);
      }
      window.addEventListener("load", function () {
        window.setTimeout(hideLoader, 1250);
      });
      window.setTimeout(hideLoader, 2800);
    })();
  </script>
  </body>
</html>
